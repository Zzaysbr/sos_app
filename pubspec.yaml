name: sos_app

description: "A new Flutter project."

publish_to: 'none'

version: 0.1.0+24

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Nearby device communication
  flutter_nearby_connections_plus: ^1.2.2

  # Local-first database
  drift: ^2.35.1
  drift_flutter: ^0.3.1

  # Immutable/value equality
  equatable: ^2.0.7

  # State management
  provider: ^6.1.5+1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  geolocator: ^14.1.1
  connectivity_plus: ^7.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2

  # Relay v2 signs offline SOS envelopes and stores the installation seed in
  # Android Keystore/iOS Keychain backed storage. Direct SOS v1 does not depend
  # on either service at runtime.
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  video_player: ^2.14.1
  flutter_image_compress: ^2.5.1
  compress_video: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.2

dependency_overrides:
  video_player_avfoundation:
    path: packages/video_player_avfoundation
  compress_video:
    path: packages/compress_video
  flutter_nearby_connections_plus:
    path: packages/flutter_nearby_connections_plus

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/emergency-icon.png
